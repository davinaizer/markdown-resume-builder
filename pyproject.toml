[project]
name = "markdown-resume-builder"
version = "0.1.0"
description = "Build a resume DOCX from Markdown"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-frontmatter>=1.0.0",
    "python-docx>=1.2.0",
]

[project.scripts]
build-resume = "resume_builder.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["resume_builder*", "tools*"]
